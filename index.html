<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1746a2">
  <meta name="description" content="Control de productos entregados en consignación y comprobantes por WhatsApp.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="images/ctrl-icon.png" type="image/png">
  <link rel="stylesheet" href="css/styles.css">
  <title>Control de Consignaciones</title>
</head>
<body>
  <header class="topbar">
    <div class="brand-lockup">
      <img class="app-logo" src="images/ctrl.png" alt="Control de Consignaciones">
      <div>
      <p class="eyebrow">CONTROL DE CONSIGNACIONES</p>
      <h1 id="page-title">Mi reparto</h1>
      </div>
    </div>
    <button class="icon-button" id="backup-button" aria-label="Abrir respaldo" title="Respaldo">⇩</button>
  </header>

  <main id="app" class="app-shell" aria-live="polite"></main>

  <nav class="bottom-nav" aria-label="Navegación principal">
    <button data-route="inicio" class="nav-item active"><span>⌂</span>Inicio</button>
    <button data-route="clientes" class="nav-item"><span>♙</span>Clientes</button>
    <button data-route="entrega" class="nav-item nav-main"><span>＋</span>Entrega</button>
    <button data-route="productos" class="nav-item"><span>▣</span>Productos</button>
    <button data-route="historial" class="nav-item"><span>≡</span>Historial</button>
  </nav>

  <dialog id="modal" class="modal">
    <div id="modal-content"></div>
  </dialog>

  <div id="toast" class="toast" role="status"></div>
  <input type="file" id="import-file" accept="application/json" hidden>
  <script src="js/app.js" defer></script>
</body>
</html>
